name: Android CI

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/filmflip-release.jks
          ls -la app/filmflip-release.jks
          keytool -list -v -keystore app/filmflip-release.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" 2>&1 | head -10

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        run: |
          ~/Android/Sdk/build-tools/37.0.0/apksigner sign \
            --ks app/filmflip-release.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --out FilmFlip-${GITHUB_REF_NAME}.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: filmflip-release
          path: FilmFlip-${{ github.ref_name }}.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FilmFlip-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
